<div class="d-flex flex-column flex-center flex-column-fluid">

    <div class="mb-3">
      <i class="pi pi-lock" style="font-size: 4rem; color: #708090"></i>
    </div>
    <h1 class="fw-bold text-dark mb-3" style="font-size: 2rem;">Access Denied</h1>
    <p class="text-muted mb-5 fs-5">
      You do not have permission to access this page.
    </p>
    <button
      class="btn btn-primary fw-semibold px-6 py-3"
      (click)="goToDashboard()"

      Go to Dashboard
    </button>
  </div>
</div>
