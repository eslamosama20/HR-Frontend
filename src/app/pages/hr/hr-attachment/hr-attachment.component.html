<p-table
  #dt1
  [value]="attachments"
  [columns]="columns"
  [resizableColumns]="true"
  columnResizeMode="expand"
  dataKey="id"
  [rows]="10"
  styleClass="p-datatable-gridlines scroller"
  [rowsPerPageOptions]="[10, 25, 50]"
  [loading]="loading"
  [paginator]="true"
  [paginatorLocale]="activeLanguage === 'en' ? 'en-US' : 'ar-EG'"


>
  <ng-template pTemplate="caption">
    <div class="flex flex-col rtl:flex-row-reverse justify-between gap-2">
      <div class="flex gap-2">
        <p-button
          styleClass="rounded-md w-auto text-nowrap"
          icon="pi pi-external-link"
          [label]="translate.instant('FINANCE.EXPORT')"
          (onClick)="exportExcel()"
        />
        <p-button
          styleClass="rounded-md w-auto text-nowrap	"
          [label]="translate.instant('FINANCE.CLEAR_FILTERS')"
          [outlined]="true"
          icon="pi pi-filter-slash"
          (onClick)="clear(dt1)"
        />
        <p-button
          styleClass="rounded-md w-auto text-nowrap	"
          label="مرفقات"
          [outlined]="true"
          icon="pi pi-plus"
          (onClick)="showAddAttachmentDialog()"
        />
      </div>

      <ng-container *ngIf="attachments.length === 0 && !loading">
        <div class="flex justify-center items-center w-full">
          <p
            class="text-center font-semibold text-xl w-full flex justify-center"
          >
            لا يوجد مرفقعات متاحة
          </p>
        </div>
      </ng-container>
      <span class="p-input-icon-left ml-auto">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          [(ngModel)]="searchValue"
          (input)="filter(dt1, $event)"
          [placeholder]="translate.instant('FINANCE.SEARCH')"
        />
      </span>
    </div>
  </ng-template>
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th style="width: 3.5rem; text-align: center;">م</th>
      <th
        style="min-width: fit-content"
        *ngFor="let column of columns"
        pResizableColumn
        [pSortableColumn]="column.field"
      >
        <div class="flex align-items-center">
          {{ column.header }}
          <p-sortIcon [field]="column.field" class="mx-1 "></p-sortIcon>
          <p-columnFilter
            *ngIf="column.filter"
            [type]="column.filterType"
            [field]="column.field"
            display="menu"
          />
        </div>
      </th>
      <th style="min-width: fit-content">
        <div class="flex align-items-center text-base">
          {{ "FINANCE.ACTIONS" | translate }}
        </div>
      </th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-Entry let-rowIndex="rowIndex">
    <tr *ngIf="attachments.length > 0">
      <td class="text-center font-bold text-gray-500 w-12">{{ rowIndex + 1 }}</td>
      <td class="text-lg rtl:text-right">
        {{ Entry.referenceNumber }}
      </td>
      <td class="text-lg rtl:text-right">
        {{
          Entry.fileName
        }}
      </td>
      <td
        class="text-lg rtl:text-right font-semibold"
      >
        {{ Entry.fileType }}
      </td>
      <td class="text-lg rtl:text-right">
          {{
            Entry.uploadedAt ? (Entry.uploadedAt | date : "yyyy/MM/dd  hh:mm a" : "": "ar-EG"): '-'
          }}
      </td>
      <td class="text-lg rtl:text-right flex gap-2">
        <ng-container
        >
          <p-overlayPanel #opAttachment [autoZIndex]="false" [baseZIndex]="80">
            <div class="flex flex-column gap-3 w-auto p-1">
              <p-button
                icon="pi pi-eye"
                class="p-button-info"
                [label]="translate.instant('FINANCE.VIEW')"
                styleClass="rounded-lg p-button-info w-full"
                (onClick)="onView(Entry)"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                class="p-button-danger"
                [label]="translate.instant('FINANCE.DELETE')"
                styleClass="rounded-lg p-button-danger w-full"
                (onClick)="confirmAttachmentDeletion($event, Entry)"
              ></p-button>
            </div>
          </p-overlayPanel>
          <p-button
            [text]="true"
            (onClick)="opAttachment.toggle($event)"
            severity="secondary"
            styleClass="p-button-outlined rounded-xl"
          >
            <ng-template pTemplate="icon">
              <i class="pi pi-cog text-xl"></i>
            </ng-template>
          </p-button>
        </ng-container>
      </td>
    </tr>
  </ng-template>
</p-table>


<p-dialog
  [(visible)]="attachmentDialogVisible"
  [header]="'المرفق'"
  [style]="{ width: '50vw' , height: '30vh' }"
  [modal]="true"
  (onHide)="closeAttachmentDialog()"
>
  <div class="field w-full flex flex-col justify-center items-center">
    <p-fileUpload
      class="w-full"
      name="attachments[]"
      mode="basic"
      chooseIcon="pi pi-upload"
      (uploadHandler)="onFileSelected($event)"
      customUpload="true"
      [auto]="true"
      maxFileSize="150000000"
      chooseLabel="ارفع ملف جديد"
      [fileLimit]="10"
      multiple
      #fileUploader
    />
    <div *ngIf="isFileUploading" class="w-full p-2 mt-2 h-full border rounded-md flex items-center justify-center">

      <i  class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>

    </div>
  </div>
</p-dialog>

<p-confirmDialog> </p-confirmDialog>
<p-toast />
