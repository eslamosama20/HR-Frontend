<!--begin::Form-->
<form
  class="form w-100"
  [formGroup]="loginForm"
  novalidate="novalidate"
  id="kt_login_signin_form"
  (ngSubmit)="submit()"
>
  <!--begin::Heading-->
  <div class="d-flex flex-column align-items-center text-center mb-8">
    <h1 class="text-gray-900 fw-bolder mb-4 fs-2x">
      {{ "AUTH.SIGN_IN" | translate }}
    </h1>

    <!-- Language Selector Inside Form -->
    <div class="login-lang-switch d-inline-flex align-items-center p-1 bg-light rounded-pill border">
      <button
        type="button"
        class="btn btn-sm px-4 py-1.5 rounded-pill text-xs fw-bold transition-all border-0"
        [class.btn-primary]="currentLang === 'ar'"
        [class.text-muted]="currentLang !== 'ar'"
        [class.bg-transparent]="currentLang !== 'ar'"
        (click)="changeLanguage('ar')"
      >
        <span class="d-flex align-items-center gap-1.5">
          <span>العربية</span>
        </span>
      </button>

      <button
        type="button"
        class="btn btn-sm px-4 py-1.5 rounded-pill text-xs fw-bold transition-all border-0"
        [class.btn-primary]="currentLang === 'en'"
        [class.text-muted]="currentLang !== 'en'"
        [class.bg-transparent]="currentLang !== 'en'"
        (click)="changeLanguage('en')"
      >
        <span class="d-flex align-items-center gap-1.5">
          <span>English</span>
        </span>
      </button>
    </div>
  </div>
  <!--end::Heading-->

  <!--begin::Separator-->
  <div class="separator mb-10 separator-custom"></div>
  <!--end::Separator-->

  <!-- begin::Alert info-->
  <!-- <ng-container *ngIf="!hasError">
    <div class="mb-10 bg-light-info p-8 rounded">
      <div class="text-info">
        Use account <strong>{{ defaultAuth.userName }}</strong> and password
        <strong>{{ defaultAuth.password }}</strong> to continue.
      </div>
    </div>
  </ng-container> -->
  <!-- end::Alert info-->

  <!-- begin::Alert error-->
  <ng-container *ngIf="hasError">
    <div class="mb-lg-15 alert alert-danger">
      <div class="alert-text font-weight-bold">
        {{ errorMessageKey | translate }}
      </div>
    </div>
  </ng-container>
  <!-- end::Alert error-->

  <!--begin::Form group-->
  <div class="fv-row mb-8">
    <label class="form-label fs-6 fw-bolder text-gray-900">{{
      "AUTH.USER_NAME" | translate
    }}</label>
    <input
      class="form-control bg-transparent"
      type="text"
      name="userName"
      formControlName="userName"
      autocomplete="off"
      [ngClass]="{
        'is-invalid':
          loginForm.controls['userName'].invalid &&
          loginForm.controls['userName'].touched,
        'is-valid':
          loginForm.controls['userName'].valid &&
          loginForm.controls['userName'].touched
      }"
    />
    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'required',
        message: 'اسم المستخدم مطلوب',
        control: loginForm.controls['userName']
      }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'minLength',
        message: 'اسم المستخدم يجب أن يكون على الأقل 3 أحرف',
        control: loginForm.controls['userName']
      }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'maxLength',
        message: 'اسم المستخدم يجب أن يكون على الأقل 200 أحرف',
        control: loginForm.controls['userName']
      }"
    ></ng-container>
  </div>
  <!--end::Form group-->

  <!--begin::Form group-->
  <div class="fv-row mb-3">
    <label class="form-label fw-bolder text-gray-900 fs-6 mb-0">{{
      "AUTH.PASSWORD" | translate
    }}</label>

    <input
      class="form-control bg-transparent"
      type="password"
      name="password"
      autocomplete="off"
      formControlName="password"
      [ngClass]="{
        'is-invalid':
          loginForm.controls['password'].invalid &&
          loginForm.controls['password'].touched,
        'is-valid':
          loginForm.controls['password'].valid &&
          loginForm.controls['password'].touched
      }"
    />
    <ng-container
      [ngTemplateOutlet]="formError"
      class=""
      [ngTemplateOutletContext]="{
        validation: 'required',
        message: 'Password is required',
        control: loginForm.controls['password']
      }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'minlength',
        message: 'Password should have at least 3 symbols',
        control: loginForm.controls['password']
      }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'maxLength',
        message: 'Password should have maximum 100 symbols',
        control: loginForm.controls['password']
      }"
    ></ng-container>
  </div>
  <!--end::Form group-->

  <!--begin::Wrapper-->
  <div class="d-flex flex-stack flex-wrap gap-3 fs-base fw-semibold mb-8">
    <div></div>

    <!--begin::Link-->
     <a routerLink="/auth/forgot-password" class="link-primary">
      {{ "AUTH.FORGOT_PASSWORD" | translate }}
    </a>
    <!--end::Link-->
  </div>
  <!--end::Wrapper-->

  <!--begin::Action-->
  <div class="d-grid mb-10">
    <button
      type="submit"
      id="kt_sign_in_submit"
      class="btn btn-primary"
      [disabled]="loginForm.invalid"
    >
      <ng-container *ngIf="isLoading$ | async">
        <span class="indicator-progress" [style.display]="'block'">
          {{ "AUTH.LOADING" | translate }}
          <span
            class="spinner-border spinner-border-sm align-middle ms-2"
          ></span>
        </span>
      </ng-container>
      <ng-container *ngIf="(isLoading$ | async) === false">
        <span class="indicator-label">{{
          "AUTH.SUBMIT_BUTTON" | translate
        }}</span>
      </ng-container>
    </button>
  </div>

  <div class="text-gray-500 text-center fw-semibold fs-6">
    {{ "AUTH.DONT_HAVE_ACCOUNT" | translate }}

    <a routerLink="/auth/registration" class="link-primary">
      {{ "AUTH.SIGN_UP" | translate }}
    </a>
  </div>

  <!--end::Action-->
</form>
<!--end::Form-->

<ng-template
  #formError
  let-control="control"
  let-message="message"
  let-validation="validation"
>
  <ng-container
    *ngIf="control.hasError(validation) && (control.dirty || control.touched)"
  >
    <div class="fv-plugins-message-container text-danger">
      <span role="alert">
        {{ message }}
      </span>
    </div>
  </ng-container>
</ng-template>
