<form
  class="form w-100"
  novalidate="novalidate"
  [formGroup]="forgotPasswordForm"
  (ngSubmit)="submit()"
  id="kt_login_password_reset_form"
>
  <!--begin::Heading-->
  <div class="text-center mb-10">
    <!--begin::Title-->
    <h1 class="text-gray-900 fw-bolder mb-3">
       هل نسيت كلمة المرور؟
    </h1>
    <!--end::Title-->

    <!--begin::Link-->
    <div class="text-gray-500 fw-semibold fs-6">
        اكتب البريد الإلكتروني لإعادة تعيين كلمة المرور
    </div>
    <!--end::Link-->
</div>
<!--begin::Heading-->

  <!-- begin::Alert error-->
  <ng-container *ngIf="errorState === errorStates.HasError">
    <div class="mb-lg-15 alert alert-danger">
      <div class="alert-text font-weight-bold">
        حدذ خطأ في المحاولة السابقة
      </div>
    </div>
  </ng-container>
  <!-- end::Alert error-->

  <ng-container *ngIf="errorState === errorStates.NoError">
    <div class="mb-10 bg-light-info p-8 rounded">
      <!--begin::Body-->
      <div class="text-info">
        تم إرسال رسالة إلكترونية إلى عنوان البريد الإلكتروني المحدد بنجاح
      </div>
      <!--end::Body-->
    </div>
  </ng-container>

  <!--begin::Form group-->
  <div class="fv-row mb-8 w-full">
    <label class="form-label fw-bolder text-gray-900 fs-6">البريد الإلكتروني</label>
    <input
      class="form-control bg-transparent w-full p-3 text-center"
      type="email"
      formControlName="email"
      placeholder="البريد الإلكتروني"
      name="email"
      [disabled]="isEmailReadOnly"
      autocomplete="off"
      [ngClass]="{
        'is-invalid': forgotPasswordForm.controls['email'].invalid,
        'is-valid': forgotPasswordForm.controls['email'].valid
      }"
    />

    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'required',
        message: 'البريد الإلكتروني مطلوب',
        control: forgotPasswordForm.controls['email']
      }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'email',
        message: 'البريد الإلكتروني غير صالح',
        control: forgotPasswordForm.controls['email']
      }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'minLength',
        message: 'البريد الإلكتروني يجب أن يكون على الأقل 3 أحرف',
        control: forgotPasswordForm.controls['email']
      }"
    ></ng-container>
    <ng-container
      [ngTemplateOutlet]="formError"
      [ngTemplateOutletContext]="{
        validation: 'maxLength',
        message: 'البريد الإلكتروني يجب أن يكون على الأقل 320 أحرف',
        control: forgotPasswordForm.controls['email']
      }"
    ></ng-container>
  </div>
  <!--end::Form group-->
  <!--begin::Form group-->
  <div class="w-full flex justify-center gap-4 pb-lg-0" *ngIf="!isEmailReadOnly">
    <button
      class="btn btn-primary my-2 w-full"
      type="submit"
      [disabled]="isLoading"
    >
      <span class="indicator-label" *ngIf="!isLoading">إرسال</span>
      <ng-container *ngIf="isLoading">
        <span >
          برجاء الانتظار ...
          <span
            class="spinner-border spinner-border-sm align-middle ms-2"
          ></span>
        </span>
      </ng-container>
    </button>
    <a
      routerLink="/auth/login"
      id="kt_login_password_reset_form_cancel_button"
      class="btn btn-light  my-2 w-full"
    >
      الغاء
    </a>
  </div>
  <!--end::Form group-->
</form>
<!--end::Form-->

<ng-template
  #formError
  let-control="control"
  let-message="message"
  let-validation="validation"
>
  <ng-container
    *ngIf="control.hasError(validation) && (control.dirty || control.touched)"
  >
    <div class="fv-plugins-message-container">
      <div class="fv-help-block">
        <span role="alert">{{ message }}</span>
      </div>
    </div>
  </ng-container>
</ng-template>


<div
  *ngIf="isEmailReadOnly && emailResponse !== null"
  class="container"
  [style]="{ 'background-color': theme === 'dark' ? '#1e1e1e' : '#ffffff' }"
>
  <header>
    <i class="bi bi-shield-lock text-light" style="font-size: 2rem"></i>
  </header>
  <div
    class="mb-3 alert alert-danger"
    id="otpMessage"
    style="padding: 10px; display: none"
  >
    <div class="alert-text font-weight-bold">Invalid OTP</div>
  </div>
  <div
    class="mb-3 alert alert-success"
    id="resendOtpMessage"
    style="padding: 10px; display: none"
  >
    <div
      class="alert-text font-weight-bold"
      [style]="{ color: theme === 'dark' ? '#ffffff' : '#000000' }"
    >
      OTP has been resent successfully
    </div>
  </div>

  <h4 [style]="{ color: theme === 'dark' ? '#ffffff' : '#000000' }"></h4>
  <form (submit)="onSubmitOtp()" class="w-full">
    <div class="p-2 py-4 border border-slate-800 rounded-lg my-4 w-full flex-col flex justify-center gap-4">
      <label class="form-label fw-bolder text-gray-900 fs-6">كلمة المرور الجديدة</label>
      <p-password
        [toggleMask]="true"
        styleClass="w-full"
        [inputStyle]="{'width': '100%'}"
        class="w-full"
        [(ngModel)]="newPassword"
        inputId="newPassword"
        name="newPassword"
        placeholder="Enter New Password"
        dir="ltr"
        [style]="{direction: 'ltr'}"
        required
      ></p-password>
      <small class="text-red-500 p-error block" *ngIf="newPassword.length === 0">
        يجب إدخال كلمة المرور الجديدة
      </small>
    </div>


    <p-inputOtp
      [(ngModel)]="otp"
      [integerOnly]="true"
      [length]="6"
      [disabled]="newPassword.length === 0"
      inputId="otpInput"
      name="otpInput"
      placeholder="Enter OTP"
      dir="ltr"
      style="direction: ltr"
    ></p-inputOtp>



  </form>
  <p>
    OTP not received?
    <button type="button" (click)="resendOtp()" class="link-button">
      Resend
    </button>
  </p>
</div>
