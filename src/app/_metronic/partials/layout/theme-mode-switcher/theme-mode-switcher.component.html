<!-- begin::Menu toggle -->
<div
  class="btn btn-icon"
  [ngClass]="toggleBtnClass"
  data-kt-menu-trigger="{default: 'click', lg: 'hover'}"
  data-kt-menu-attach="parent"
  data-kt-menu-placement="bottom-end"
>
  <ng-container *ngIf="mode$ | async as mode">
    <ng-container *ngIf="mode === 'dark'">
      <app-keenicon
        name="moon"
        class="fs-2 fs-lg-1 theme-light-hide"
        [ngClass]="toggleBtnIconClass"
      ></app-keenicon>
    </ng-container>
    <ng-container *ngIf="mode === 'light'">
      <app-keenicon
        name="night-day"
        class="fs-2 fs-lg-1 theme-dark-hide"
        [ngClass]="toggleBtnIconClass"
      ></app-keenicon>
    </ng-container>
  </ng-container>
</div>
<!-- end::Menu toggle -->

<!-- begin::Menu -->
<div
  class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-title-gray-700 menu-icon-muted menu-active-bg menu-state-primary fw-semibold py-4 fs-base w-175px"
  data-kt-menu="true"
>
  <ng-container *ngIf="menuMode$ | async as menuMode">
    <!-- Light -->
    <div class="menu-item px-3 my-0">
      <a
        class="menu-link px-3 py-2"
        [ngClass]="{ active: menuMode === 'light' }"
        (click)="switchMode('light')"
      >
        <span class="menu-icon" data-kt-element="icon">
          <app-keenicon name="night-day" class="fs-3"></app-keenicon>
        </span>
        <span class="menu-title">Light</span>
      </a>
    </div>

    <!-- Dark -->
    <div class="menu-item px-3 my-0">
      <a
        class="menu-link px-3 py-2"
        [ngClass]="{ active: menuMode === 'dark' }"
        (click)="switchMode('dark')"
      >
        <span class="menu-icon" data-kt-element="icon">
          <app-keenicon name="moon" class="fs-3"></app-keenicon>
        </span>
        <span class="menu-title">Dark</span>
      </a>
    </div>

    <!-- System -->
    <div class="menu-item px-3 my-0">
      <a
        class="menu-link px-3 py-2"
        [ngClass]="{ active: menuMode === 'system' }"
        (click)="switchMode('system')"
      >
        <span class="menu-icon" data-kt-element="icon">
          <app-keenicon name="screen" class="fs-3"></app-keenicon>
        </span>
        <span class="menu-title">System</span>
      </a>
    </div>

    <!-- Divider (optional) -->
    <div class="separator my-2"></div>

    <!-- Light-Green (Sidebar only) -->
    <div class="menu-item px-3 my-0">
      <a
        class="menu-link px-3 py-2"
        [ngClass]="{ active: isLightGreenActive }"
        (click)="applyLightGreenSidebar()"
      >
        <span class="menu-icon" data-kt-element="icon">
          <i class="pi pi-palette fs-3" aria-hidden="true"></i>
        </span>
        <span class="menu-title">light-green</span>
      </a>
    </div>
    <div class="menu-item px-3 my-0">
      <a
        class="menu-link px-3 py-2"
        [ngClass]="{ active: isLightDarkBlueActive }"
        (click)="applyLightDarkBlueSidebar()"

      >
        <span class="menu-icon" data-kt-element="icon">
          <i class="pi pi-palette fs-3" aria-hidden="true"></i>
        </span>
        <span class="menu-title">light-darkblue</span>
      </a>
    </div>
    <div class="menu-item px-3 my-0">
      <a
        class="menu-link px-3 py-2"
        [ngClass]="{ active: isLightIndigoActive }"
        (click)="applyLightIndigoSidebar()"

      >
        <span class="menu-icon" data-kt-element="icon">
          <i class="pi pi-palette fs-3" aria-hidden="true"></i>
        </span>
        <span class="menu-title">light-indigo</span>
      </a>
    </div>
    
  </ng-container>
</div>
<!-- end::Menu -->
